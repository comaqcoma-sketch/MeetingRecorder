yaml
name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 휴대폰용 다운로드 링크에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk meeting-recorder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest meeting-recorder.apk \
            --title "회의 녹음 최신 빌드" \
            --notes "자동 빌드: ${{ github.sha }}"
