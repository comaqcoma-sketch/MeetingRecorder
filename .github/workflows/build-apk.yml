
name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 도구(NDK·CMake) 설치
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: APK 빌드
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      - name: 오류 요약 표시
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|CMake Error|undefined reference|> " build.log | head -60 > err.txt || true
          python3 - <<'PY'
          lines = open("err.txt", encoding="utf-8", errors="replace").read().splitlines()
          for i in range(0, len(lines), 12):
              msg = "%0A".join(l.replace("%", "%25").replace("\r", "")[:300] for l in lines[i:i+12])
              print("::error title=build-%d::%s" % (i // 12, msg))
          PY

      - name: 휴대폰용 다운로드 링크에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk meeting-recorder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest meeting-recorder.apk \
            --title "회의 녹음 최신 빌드" \
            --notes "자동 빌드: ${{ github.sha }}"
